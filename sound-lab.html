<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音效試聽</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #13254f;
        --muted: #5b6f9a;
        --card: #ffffff;
        --line: #d6e6fb;
        --accent: #2b4fb8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #d9f0ff, #a6d6fb);
        min-height: 100vh;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        margin: 8px 0 4px;
        font-size: 24px;
      }
      p.lead {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.6;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 12px;
        box-shadow: 0 4px 14px rgba(20, 50, 120, 0.08);
      }
      h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .desc {
        margin: 0 0 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        border: 2px solid var(--line);
        background: #f3f8ff;
        color: var(--ink);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        text-align: left;
        min-width: 140px;
        flex: 1 1 140px;
      }
      button b {
        display: block;
        font-size: 16px;
        color: var(--accent);
      }
      button small {
        color: var(--muted);
      }
      button.playing {
        border-color: var(--accent);
        background: #e3edff;
      }
      label.chain {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        margin: 16px 0 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🔊 音效試聽</h1>
      <p class="lead">
        每一區點幾個按鈕聽聽看，挑出你覺得最像原版、或最喜歡的那個，跟我說「旋轉 B、消除 C、音樂 A」這樣就好。<br />
        <b>A 都是目前遊戲裡的聲音。</b>手機請先關掉靜音模式。
      </p>

      <section>
        <h2>① 旋轉</h2>
        <p class="desc">按一下旋轉時的聲音</p>
        <div class="row" data-group="rotate"></div>
      </section>

      <section>
        <h2>② 消除</h2>
        <p class="desc">三顆寶石消掉的聲音。可以拉連鎖數聽連鎖時音高的變化。</p>
        <label class="chain">連鎖 <input id="chain" type="range" min="1" max="5" value="1" /> <span id="chain-n">1</span></label>
        <div class="row" data-group="clear"></div>
      </section>

      <section>
        <h2>③ 做出星星／星星消除</h2>
        <p class="desc">特殊時刻的音效</p>
        <div class="row" data-group="star"></div>
      </section>

      <section>
        <h2>④ 升級</h2>
        <div class="row" data-group="level"></div>
      </section>

      <section>
        <h2>⑤ 炸彈倒數</h2>
        <p class="desc">每個版本會播「普通」再播「剩 3 步以內」</p>
        <div class="row" data-group="tick"></div>
      </section>

      <section>
        <h2>⑥ 背景音樂</h2>
        <p class="desc">點一下開始播放，再點一次停止</p>
        <div class="row" data-group="music"></div>
      </section>

      <p class="note">選完跟我說就好，這一頁之後會刪掉。</p>
    </main>

    <script type="module">
      const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
      const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
      let ctx, out, noiseBuf, musicBus, echo;

      function init() {
        if (ctx) return ctx.state === 'suspended' && ctx.resume();
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        try {
          if (navigator.audioSession) navigator.audioSession.type = 'playback';
        } catch {}
        out = ctx.createGain();
        out.gain.value = 0.8;
        out.connect(ctx.createDynamicsCompressor()).connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        musicBus = ctx.createGain();
        musicBus.gain.value = 0.22;
        musicBus.connect(out);
        echo = ctx.createDelay(1);
        echo.delayTime.value = 0.47;
        const fb = ctx.createGain();
        fb.gain.value = 0.3;
        const wet = ctx.createGain();
        wet.gain.value = 0.35;
        echo.connect(fb).connect(echo);
        echo.connect(wet).connect(musicBus);
      }

      function tone({ freq, to, type = 'sine', dur = 0.15, vol = 0.25, attack = 0.005, at = 0, dest = out }) {
        const t = ctx.currentTime + at;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(dest);
        o.start(t);
        o.stop(t + dur + 0.05);
        return g;
      }

      function noise({ dur = 0.2, vol = 0.3, freq = 1200, to, at = 0, type = 'bandpass', q = 1 }) {
        const t = ctx.currentTime + at;
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.Q.value = q;
        f.frequency.setValueAtTime(freq, t);
        if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f).connect(g).connect(out);
        s.start(t);
        s.stop(t + dur + 0.05);
      }

      // 玻璃／水晶鈴：不成整數倍的泛音，高泛音衰減得快
      function bell(freq, { at = 0, vol = 0.18, dur = 1.2, dest = out } = {}) {
        [[1, 1, 1], [2.76, 0.45, 0.5], [5.4, 0.25, 0.3], [8.9, 0.12, 0.2]].forEach(([r, a, d]) =>
          tone({ freq: freq * r, vol: vol * a, dur: dur * d, at, dest }),
        );
      }

      // 馬林巴琴：木頭的溫暖短音
      function marimba(freq, { at = 0, vol = 0.3, dest = out } = {}) {
        tone({ freq, vol, dur: 0.5, at, dest });
        tone({ freq: freq * 4, vol: vol * 0.25, dur: 0.08, at, dest });
        tone({ freq: freq * 10, vol: vol * 0.08, dur: 0.03, at, dest });
      }

      // 音樂盒：高音、清脆、尾巴長
      function musicBox(freq, { at = 0, vol = 0.14, dest = out } = {}) {
        tone({ freq, vol, dur: 1.4, at, dest });
        tone({ freq: freq * 3, vol: vol * 0.3, dur: 0.4, at, dest });
      }

      const chain = () => Number(document.getElementById('chain').value);

      const SOUNDS = {
        rotate: {
          A: ['目前', '上揚的咻＋雜音', () => { tone({ freq: 380, to: 620, type: 'triangle', dur: 0.08, vol: 0.12 }); noise({ dur: 0.05, vol: 0.05, freq: 3000 }); }],
          B: ['木頭喀', '短促的木頭敲擊', () => { noise({ dur: 0.04, vol: 0.35, freq: 1800, q: 6 }); tone({ freq: 620, to: 380, dur: 0.06, vol: 0.18 }); }],
          C: ['水晶叮', '小小的玻璃聲', () => bell(1568, { vol: 0.08, dur: 0.5 })],
          D: ['柔和滑動', '低調的呼—', () => noise({ dur: 0.18, vol: 0.12, freq: 600, to: 1800, type: 'bandpass', q: 2 })],
        },
        clear: {
          A: ['目前', '啵啵泡泡聲', () => { const base = 72 + PENTA[chain() - 1]; for (let k = 0; k < 3; k++) { const f = mtof(base + PENTA[k]); tone({ freq: f * 0.6, to: f * 1.4, dur: 0.09, vol: 0.18, at: k * 0.035 }); } tone({ freq: mtof(base + 12), type: 'triangle', dur: 0.35, vol: 0.08, at: 0.05 }); }],
          B: ['水晶鈴', '清脆的玻璃鈴，連鎖越高越亮', () => { const base = 79 + PENTA[chain() - 1]; bell(mtof(base), { vol: 0.16 }); bell(mtof(base + 7), { vol: 0.1, at: 0.06 }); }],
          C: ['馬林巴', '溫暖的木琴三連音', () => { const base = 67 + PENTA[chain() - 1]; [0, 4, 7].forEach((s, k) => marimba(mtof(base + s), { at: k * 0.05 })); }],
          D: ['寶石碎裂', '亮晶晶的碎裂＋鈴', () => { const base = 84 + PENTA[chain() - 1]; noise({ dur: 0.25, vol: 0.18, freq: 6000, to: 2500, type: 'highpass' }); bell(mtof(base), { vol: 0.1, dur: 0.8, at: 0.02 }); }],
        },
        star: {
          A: ['目前', '五個音往上爬', () => [72, 76, 79, 84, 88].forEach((m, k) => tone({ freq: mtof(m), type: 'triangle', dur: 0.5, vol: 0.12, at: k * 0.06 }))],
          B: ['魔法閃光', '快速往上刷的鈴聲', () => [84, 86, 88, 91, 93, 96, 98, 100].forEach((m, k) => bell(mtof(m), { vol: 0.07, dur: 0.6, at: k * 0.035 }))],
          C: ['和弦光芒', '一個明亮和弦慢慢散開', () => { [72, 76, 79, 84].forEach((m) => tone({ freq: mtof(m), dur: 1.6, vol: 0.07, attack: 0.04 })); bell(mtof(96), { vol: 0.08, at: 0.1 }); }],
          D: ['音樂盒', '叮咚叮咚的小旋律', () => [84, 88, 91, 96].forEach((m, k) => musicBox(mtof(m), { at: k * 0.09 }))],
        },
        level: {
          A: ['目前', '紅白機風號角', () => { [67, 72, 76, 79, 84].forEach((m, k) => tone({ freq: mtof(m), type: 'square', dur: 0.18, vol: 0.05, at: k * 0.08 })); tone({ freq: mtof(84), type: 'triangle', dur: 0.8, vol: 0.12, at: 0.4 }); }],
          B: ['鈴聲號角', '水晶鈴往上＋長音', () => { [72, 76, 79, 84].forEach((m, k) => bell(mtof(m), { vol: 0.12, at: k * 0.09 })); bell(mtof(91), { vol: 0.12, dur: 1.8, at: 0.4 }); }],
          C: ['馬林巴', '開心的木琴小段落', () => [60, 64, 67, 72, 67, 72, 76].forEach((m, k) => marimba(mtof(m + 7), { at: k * 0.09, vol: 0.25 }))],
        },
        tick: {
          A: ['目前', '嗶／嗶嗶', () => { tone({ freq: 660, type: 'square', dur: 0.07, vol: 0.04 }); [0.6, 0.72].forEach((at) => tone({ freq: 990, type: 'square', dur: 0.07, vol: 0.08, at })); }],
          B: ['時鐘滴答', '滴答／滴答滴答', () => { noise({ dur: 0.03, vol: 0.3, freq: 3200, q: 8 }); [0.6, 0.75, 0.9, 1.05].forEach((at, k) => noise({ dur: 0.03, vol: 0.35, freq: k % 2 ? 2400 : 3200, q: 8, at })); }],
          C: ['心跳', '咚咚／急促的咚咚', () => { [0, 0.18].forEach((at) => tone({ freq: 70, to: 45, dur: 0.15, vol: 0.5, at })); [0.7, 0.8, 0.95, 1.05].forEach((at) => tone({ freq: 80, to: 50, dur: 0.12, vol: 0.55, at })); }],
        },
      };

      // ---------- 背景音樂 ----------
      const CHORDS = [
        { bass: 48, notes: [60, 64, 67, 71] },
        { bass: 45, notes: [57, 60, 64, 67] },
        { bass: 41, notes: [57, 60, 64, 65] },
        { bass: 43, notes: [55, 59, 62, 64] },
      ];
      const ARP = [0, 1, 2, 3, 2, 1, 2, 3];
      const MUSIC = {
        A: ['目前', '電子琶音＋貝斯', 96, (i, at) => {
          const c = CHORDS[Math.floor(i / 8) % 4], beat = i % 8, d = musicBus;
          if (beat === 0 || beat === 4) { tone({ freq: mtof(c.bass), dur: 0.9, vol: 0.35, attack: 0.02, at, dest: d }); }
          if (beat === 0) c.notes.forEach((m) => tone({ freq: mtof(m), dur: 2.4, vol: 0.035, attack: 0.4, at, dest: d }));
          tone({ freq: mtof(c.notes[ARP[beat]] + 12), type: 'triangle', dur: 0.28, vol: 0.07, at, dest: d }).connect(echo);
        }],
        B: ['夢幻鋼琴', '慢、柔和、像下午的咖啡廳', 72, (i, at) => {
          const c = CHORDS[Math.floor(i / 8) % 4], beat = i % 8, d = musicBus;
          if (beat === 0) { tone({ freq: mtof(c.bass), dur: 2.6, vol: 0.22, attack: 0.03, at, dest: d }); c.notes.forEach((m) => tone({ freq: mtof(m), dur: 3, vol: 0.04, attack: 0.6, at, dest: d })); }
          if (beat % 2 === 0) { const m = c.notes[ARP[beat]] + 12; tone({ freq: mtof(m), dur: 1.2, vol: 0.09, attack: 0.01, at, dest: d }).connect(echo); tone({ freq: mtof(m) * 2, dur: 0.4, vol: 0.02, at, dest: d }); }
          if (beat === 5 && Math.random() < 0.6) tone({ freq: mtof(84 + PENTA[Math.floor(Math.random() * 5)]), dur: 1.4, vol: 0.05, at, dest: d }).connect(echo);
        }],
        C: ['輕快馬林巴', '有彈性、偏熱帶的感覺', 112, (i, at) => {
          const c = CHORDS[Math.floor(i / 8) % 4], beat = i % 8, d = musicBus;
          if (beat === 0 || beat === 3 || beat === 6) tone({ freq: mtof(c.bass), dur: 0.3, vol: 0.3, at, dest: d });
          const pattern = [0, 2, 1, 3, 2, 0, 3, 1];
          if (beat !== 5) marimba(mtof(c.notes[pattern[beat]] + 12), { at, vol: 0.12, dest: d });
          if (beat === 4) noise({ dur: 0.04, vol: 0.06, freq: 8000, type: 'highpass', at });
        }],
        D: ['音樂盒', '叮叮咚咚、安靜可愛', 84, (i, at) => {
          const c = CHORDS[Math.floor(i / 8) % 4], beat = i % 8, d = musicBus;
          if (beat === 0) tone({ freq: mtof(c.bass + 12), dur: 1.8, vol: 0.12, at, dest: d });
          if (beat % 2 === 0 || Math.random() < 0.3) musicBox(mtof(c.notes[ARP[beat]] + 24), { at, vol: 0.07, dest: d });
        }],
      };
      let musicTimer = null;
      let musicKey = null;
      function playMusic(key) {
        stopMusic();
        musicKey = key;
        const [, , bpm, step] = MUSIC[key];
        const len = 60 / bpm / 2;
        let next = ctx.currentTime + 0.1;
        let i = 0;
        musicTimer = setInterval(() => {
          while (next < ctx.currentTime + 0.25) {
            step(i++, next - ctx.currentTime);
            next += len;
          }
        }, 60);
      }
      function stopMusic() {
        clearInterval(musicTimer);
        musicTimer = null;
        musicKey = null;
      }

      // ---------- 按鈕 ----------
      for (const el of document.querySelectorAll('[data-group]')) {
        const group = el.dataset.group;
        const table = group === 'music' ? MUSIC : SOUNDS[group];
        for (const [key, [name, desc, ...rest]] of Object.entries(table)) {
          const btn = document.createElement('button');
          btn.innerHTML = `<b>${key}　${name}</b><small>${desc}</small>`;
          btn.addEventListener('click', () => {
            init();
            if (group !== 'music') return rest[0]();
            const playing = musicKey === key;
            for (const b of el.querySelectorAll('button')) b.classList.remove('playing');
            if (playing) return stopMusic();
            btn.classList.add('playing');
            playMusic(key);
          });
          el.appendChild(btn);
        }
      }
      const chainEl = document.getElementById('chain');
      chainEl.addEventListener('input', () => (document.getElementById('chain-n').textContent = chainEl.value));
    </script>
  </body>
</html>
