# 部署到 GitHub Pages：先跑單元測試，通過才發佈。
# 使用跑在 Node 24 上的 actions，取代 GitHub 內建、仍用 Node 20 的「pages build and deployment」。
# 需要在 Settings → Pages → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # 把 __BUILD__ 換成 commit 編號前 7 碼：檔案網址與離線快取名稱每次部署都不同，瀏覽器不會卡在舊版
      - name: Stamp build version
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" index.html sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
