<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a6d6fb" />
    <meta name="description" content="向 MSN 經典遊戲致敬的 3D 旋轉泡泡球，直接在瀏覽器裡玩。" />
    <title>旋轉泡泡球</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- 加到 iPhone 主畫面時用的圖示與全螢幕設定 -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="旋轉泡泡球" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="float-layer"></div>
        <div id="callout"></div>
      </div>

      <!-- 原版那條上方橫幅：等級／分數／剩餘目標 -->
      <header id="hud" class="hidden">
        <div class="stat">
          <span class="label" data-i18n="level"></span>
          <span id="level" class="value">1</span>
        </div>
        <div class="stat">
          <span class="label" data-i18n="score"></span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label" data-i18n="goal"></span>
          <span id="goal" class="value">0</span>
        </div>
      </header>

      <main id="play-area">
        <noscript>這個遊戲需要 JavaScript。</noscript>
      </main>

      <!-- 左下：旋轉方向（跟原版一樣）、中間：選單、右下：提示 -->
      <footer id="controls" class="hidden">
        <button id="btn-dir" class="spin">↻</button>
        <button id="btn-pause" class="pill" data-i18n="menuButton"></button>
        <button id="btn-hint" class="round" data-i18n-title="hint">💡</button>
      </footer>

      <section id="screen-title" class="screen">
        <div class="panel title-panel">
          <h1 data-i18n="title"></h1>
          <p class="subtitle" data-i18n="subtitle"></p>
          <button class="mode" data-mode="classic">
            <b data-i18n="mode.classic"></b>
            <small data-i18n="mode.classic.desc"></small>
            <span class="best-line"><span data-i18n="best"></span> <span id="best-classic">0</span></span>
          </button>
          <button class="mode bomb" data-mode="bomb">
            <b>💣 <span data-i18n="mode.bomb"></span></b>
            <small data-i18n="mode.bomb.desc"></small>
            <span class="best-line"><span data-i18n="best"></span> <span id="best-bomb">0</span></span>
          </button>
          <div class="row">
            <button class="secondary" data-open="howto" data-i18n="howto"></button>
            <button class="secondary" data-open="settings" data-i18n="settings"></button>
          </div>
          <!-- 已經用 App 開啟時隱藏 -->
          <button id="btn-install" class="secondary" data-i18n="install"></button>
        </div>
      </section>

      <section id="screen-howto" class="screen hidden">
        <div class="panel scroll">
          <h2 data-i18n="howto"></h2>
          <div class="howto" data-i18n-html="howtoBody"></div>
          <div class="howto">
            <h3 data-i18n="installTitle"></h3>
            <div data-i18n-html="installBody"></div>
          </div>
          <button data-close data-i18n="close"></button>
        </div>
      </section>

      <section id="screen-install" class="screen hidden">
        <div class="panel scroll">
          <h2 data-i18n="installTitle"></h2>
          <div class="howto" data-i18n-html="installBody"></div>
          <button data-close data-i18n="close"></button>
        </div>
      </section>

      <section id="screen-settings" class="screen hidden">
        <div class="panel">
          <h2 data-i18n="settings"></h2>
          <label class="setting">
            <span data-i18n="language"></span>
            <select id="set-lang">
              <option value="auto" data-i18n="lang.auto"></option>
              <option value="zh-Hant">繁體中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </label>
          <label class="setting">
            <span data-i18n="sfx"></span>
            <button id="set-sfx" class="toggle"></button>
          </label>
          <label class="setting">
            <span data-i18n="music"></span>
            <button id="set-music" class="toggle"></button>
          </label>
          <label class="setting">
            <span data-i18n="quality"></span>
            <select id="set-quality">
              <option value="auto" data-i18n="quality.auto"></option>
              <option value="high" data-i18n="quality.high"></option>
              <option value="low" data-i18n="quality.low"></option>
            </select>
          </label>
          <button data-close data-i18n="close"></button>
        </div>
      </section>

      <section id="screen-pause" class="screen hidden">
        <div class="panel">
          <h2 data-i18n="paused"></h2>
          <button id="btn-resume" data-i18n="resume"></button>
          <button class="secondary" id="btn-restart" data-i18n="restart"></button>
          <button class="secondary" data-open="howto" data-i18n="howto"></button>
          <button class="secondary" data-open="settings" data-i18n="settings"></button>
          <button class="secondary" data-action="menu" data-i18n="menu"></button>
        </div>
      </section>

      <section id="screen-over" class="screen hidden">
        <div class="panel">
          <h2 data-i18n="gameover"></h2>
          <p id="over-reason" class="reason"></p>
          <div id="over-score" class="big-score">0</div>
          <p id="over-best" class="newbest hidden" data-i18n="newbest"></p>
          <dl id="over-stats" class="stats"></dl>
          <button id="btn-again" data-i18n="playagain"></button>
          <button class="secondary" data-action="menu" data-i18n="menu"></button>
        </div>
      </section>
    </div>
  </body>
</html>
